name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: The built extension must not contain a remote script or an env file
        run: |
          test -f extension/dist/manifest.json
          ! grep -rIlE "recaptcha/api\.js|recaptcha/enterprise\.js|www\.gstatic\.com/firebasejs" extension/dist
          ! find extension/dist -name ".env*" | grep .
      - name: The Functions build must be present
        run: test -f functions/lib/index.js
